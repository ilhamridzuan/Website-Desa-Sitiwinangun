<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Virtual Tour 360° — Desa Sitiwinangun</title>
  <meta name="description" content="Jelajahi Desa Sitiwinangun dan rumah produksi gerabah dalam panorama 360° interaktif.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600,700" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --amber:    #f59e0b;
      --amber-d:  #b45309;
      --amber-l:  #fde68a;
      --dark:     #120b06;
      --dark2:    #1e1208;
      --glass:    rgba(0,0,0,.52);
      --glass-b:  rgba(255,255,255,.10);
      --radius:   18px;
      --font:     'Instrument Sans', system-ui, sans-serif;
    }
    html,body{height:100%;overflow:hidden;background:var(--dark);color:#fff;font-family:var(--font)}

    /* ── Panorama canvas ─────────────────── */
    #pano{position:fixed;inset:0;z-index:0}

    /* ── HUD top ─────────────────────────── */
    #hud-top{
      position:fixed;top:14px;left:14px;right:14px;z-index:40;
      display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
      pointer-events:none;
    }
    .hud-card{
      pointer-events:auto;
      background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border:1px solid var(--glass-b);border-radius:var(--radius);
      padding:10px 16px;box-shadow:0 8px 32px rgba(0,0,0,.45);
    }
    .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.26em;color:var(--amber-l);margin-bottom:3px}
    #scene-title{font-size:15px;font-weight:600;line-height:1.25;max-width:280px}
    #scene-counter{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px}

    /* ── Controls row ────────────────────── */
    #controls{display:flex;gap:8px;pointer-events:auto;align-items:center;flex-wrap:wrap}
    .btn{
      border:0;border-radius:999px;cursor:pointer;font-family:var(--font);font-weight:700;
      font-size:13px;padding:9px 16px;transition:all .18s ease;
      display:flex;align-items:center;gap:6px;white-space:nowrap;
    }
    .btn-amber{background:var(--amber);color:#1a0800}
    .btn-amber:hover{background:#fbbf24;transform:translateY(-1px);box-shadow:0 4px 14px rgba(245,158,11,.5)}
    .btn-ghost{background:var(--glass);border:1px solid var(--glass-b);color:#fff}
    .btn-ghost:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25)}
    .btn-sm{padding:7px 12px;font-size:12px}

    /* ── Scene list drawer ───────────────── */
    #scene-drawer{
      position:fixed;top:0;left:0;bottom:0;z-index:50;width:280px;
      background:rgba(14,8,3,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border-right:1px solid rgba(255,255,255,.08);
      display:flex;flex-direction:column;
      transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    }
    #scene-drawer.open{transform:translateX(0)}
    #drawer-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:16px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;
    }
    #drawer-header h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--amber-l)}
    #drawer-close{background:0;border:0;color:rgba(255,255,255,.5);cursor:pointer;padding:4px;border-radius:6px;transition:color .15s}
    #drawer-close:hover{color:#fff}
    #drawer-search{
      margin:12px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.07);color:#fff;font-family:var(--font);font-size:13px;
      outline:0;transition:border .15s;
    }
    #drawer-search::placeholder{color:rgba(255,255,255,.38)}
    #drawer-search:focus{border-color:var(--amber)}
    #scene-list{flex:1;overflow-y:auto;padding:4px 10px 16px}
    #scene-list::-webkit-scrollbar{width:4px}
    #scene-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
    .scene-btn{
      display:flex;align-items:center;gap:10px;width:100%;text-align:left;
      border:0;background:0;color:rgba(255,255,255,.75);cursor:pointer;
      padding:9px 10px;border-radius:10px;font-family:var(--font);font-size:12.5px;
      transition:all .15s;margin-bottom:2px;
    }
    .scene-btn:hover{background:rgba(255,255,255,.09);color:#fff}
    .scene-btn.active{background:rgba(245,158,11,.18);color:var(--amber-l);font-weight:600}
    .scene-num{
      width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.08);
      display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
      flex-shrink:0;color:rgba(255,255,255,.6);
    }
    .scene-btn.active .scene-num{background:rgba(245,158,11,.25);color:var(--amber)}

    /* ── Bottom nav ──────────────────────── */
    #hud-bottom{
      position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:40;
      display:flex;align-items:center;gap:10px;pointer-events:auto;
    }
    #progress-bar-wrap{
      background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border:1px solid var(--glass-b);border-radius:999px;
      padding:6px 14px;display:flex;align-items:center;gap:10px;
    }
    #progress-bar{width:140px;height:3px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
    #progress-fill{height:100%;background:var(--amber);border-radius:3px;transition:width .4s ease}

    /* ── Guide hint ──────────────────────── */
    #guide{
      position:fixed;bottom:14px;right:14px;z-index:40;
      background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border:1px solid var(--glass-b);border-radius:12px;
      padding:8px 14px;font-size:11.5px;color:rgba(255,255,255,.65);
      pointer-events:none;letter-spacing:.03em;
    }

    /* ── Spinner overlay ─────────────────── */
    #loader{
      position:fixed;inset:0;z-index:60;background:var(--dark);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
      transition:opacity .4s ease;
    }
    #loader.hidden{opacity:0;pointer-events:none}
    .spinner{
      width:48px;height:48px;border:3px solid rgba(255,255,255,.12);
      border-top-color:var(--amber);border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    #loader p{font-size:12px;text-transform:uppercase;letter-spacing:.28em;color:rgba(255,255,255,.45)}

    /* ── Edge arrows ─────────────────────── */
    .edge-arrow{
      position:fixed;top:50%;transform:translateY(-50%);z-index:35;
      width:46px;height:46px;border-radius:50%;
      background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      border:1.5px solid rgba(255,255,255,.18);color:#fff;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      transition:all .22s ease;font-size:20px;opacity:.65;
      box-shadow:0 4px 16px rgba(0,0,0,.35);
    }
    .edge-arrow:hover{opacity:1;background:rgba(245,158,11,.8);border-color:var(--amber);transform:translateY(-50%) scale(1.08)}
    #arr-prev{left:12px}
    #arr-next{right:12px}

    /* ── Pannellum overrides ─────────────── */
    .pnlm-controls-container,.pnlm-compass,.pnlm-panorama-info,.pnlm-load-box{display:none!important}

    /* ── Responsive ──────────────────────── */
    @media(max-width:640px){
      #scene-title{font-size:13px;max-width:180px}
      #guide{display:none}
      #progress-bar{width:90px}
    }
  </style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <div class="spinner"></div>
  <p>Memuat panorama…</p>
</div>

<!-- Panorama -->
<div id="pano"></div>

<!-- HUD Top -->
<div id="hud-top">
  <div class="hud-card">
    <p class="eyebrow">Virtual Tour 360° · Sitiwinangun</p>
    <p id="scene-title">Memuat…</p>
    <p id="scene-counter"></p>
  </div>
  <div id="controls">
    <button class="btn btn-ghost btn-sm" id="btn-list" title="Daftar Panorama" onclick="toggleDrawer()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      Lokasi
    </button>
    <button class="btn btn-ghost btn-sm" id="btn-full" onclick="toggleFullscreen()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      <span id="fs-label">Fullscreen</span>
    </button>
  </div>
</div>

<!-- Scene drawer -->
<div id="scene-drawer">
  <div id="drawer-header">
    <h2>Pilih Lokasi</h2>
    <button id="drawer-close" onclick="toggleDrawer()" aria-label="Tutup">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <input id="drawer-search" type="search" placeholder="Cari lokasi…" oninput="filterScenes(this.value)">
  <div id="scene-list"></div>
</div>

<!-- Edge arrows -->
<button class="edge-arrow" id="arr-prev" onclick="goRelative(-1)" title="Sebelumnya">&#8592;</button>
<button class="edge-arrow" id="arr-next" onclick="goRelative(1)"  title="Selanjutnya">&#8594;</button>

<!-- Bottom progress -->
<div id="hud-bottom">
  <button class="btn btn-ghost btn-sm" onclick="goRelative(-1)">&#8592;</button>
  <div id="progress-bar-wrap">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <span id="progress-label" style="font-size:11px;color:rgba(255,255,255,.55)"></span>
  </div>
  <button class="btn btn-amber btn-sm" onclick="goRelative(1)">&#8594;</button>
</div>

<!-- Guide -->
<div id="guide">🖱 Drag/geser · Scroll/pinch zoom · ← → navigasi</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
// ============================================================

// ============================================================
const SCENES = {
  /* ── BAGIAN 1: Titik Awal & Jalan Masuk (scene 1-3) ── */

    ],

  scene_002: {

    panorama: 'IMG_20260611_095931_00_072.jpg',
    hotSpots: [],
  },
  scene_003: {
    title:    'Start — Ke Arah Kanan (Masjid)',
    panorama: 'IMG_20260611_100017_00_073.jpg',
    hotSpots: [],
  },

  /* ── BAGIAN 2: Menuju Pengrajin 1 (scene 4-10) ── */
  scene_004: {
    title:    'Lurus Menuju Pengrajin 1',
    panorama: 'IMG_20260611_100246_00_075.jpg',
    hotSpots: [],
  },
  scene_005: {
    title:    'Belok Kanan ke Pengrajin 1',
    panorama: 'IMG_20260611_100402_00_076.jpg',
    hotSpots: [],
  },
  scene_006: {
    title:    'Setelah Belok — Lurus ke Pengrajin 1',
    panorama: 'IMG_20260611_100610_00_078.jpg',
    hotSpots: [],
  },
  scene_007: {
    title:    'Lurus ke Pengrajin 1 (Kiri: Pengrajin 2)',
    panorama: 'IMG_20260611_100724_00_079.jpg',
    hotSpots: [],
  },
  scene_008: {
    title:    'Tempat Pembakaran — Pengrajin 1',
    panorama: 'IMG_20260611_100842_00_080.jpg',
    hotSpots: [],
  },
  scene_009: {
    title:    'Halaman Pengrajin 1',
    panorama: 'IMG_20260611_102419_00_081.jpg',
    hotSpots: [],
  },
  scene_010: {
    title:    'Area Produksi Pengrajin 1',
    panorama: 'IMG_20260611_102452_00_082.jpg',
    hotSpots: [],
  },

  /* ── BAGIAN 3: Pengrajin 2 (scene 11) ── */
  scene_011: {
    title:    'Tempat Pengrajin 2',
    panorama: 'IMG_20260611_104448_00_083.jpg',
    hotSpots: [],
  },

  /* ── BAGIAN 4: Menuju Pengrajin 3 (scene 12-17) ── */
  scene_012: {
    title:    'Lurus Menuju Pengrajin 3',
    panorama: 'IMG_20260611_104800_00_084.jpg',
    hotSpots: [],
  },
  scene_013: {
    title:    'Jalan Menuju Pengrajin 3',
    panorama: 'IMG_20260611_104829_00_085.jpg',
    hotSpots: [],
  },
  scene_014: {
    title:    'Belok Kiri ke Pengrajin 3',
    panorama: 'IMG_20260611_105104_00_086.jpg',
    hotSpots: [],
  },
  scene_015: {
    title:    'Lurus ke Pengrajin 3',
    panorama: 'IMG_20260611_105220_00_087.jpg',
    hotSpots: [],
  },
  scene_016: {
    title:    'Lurus Menuju Pengrajin 3 (Lanjutan)',
    panorama: 'IMG_20260611_105248_00_088.jpg',
    hotSpots: [],
  },
  scene_017: {
    title:    'Masih Lurus Kanan ke Pengrajin 3',
    panorama: 'IMG_20260611_105350_00_089.jpg',
    hotSpots: [],
  },

  /* ── BAGIAN 5: Titik-titik lanjutan (scene 18-43) ── */
  scene_018: { title:'Titik Panorama 18', panorama:'IMG_20260611_105426_00_090.jpg', hotSpots:[] },
  scene_019: { title:'Titik Panorama 19', panorama:'IMG_20260611_105530_00_091.jpg', hotSpots:[] },
  scene_020: { title:'Titik Panorama 20', panorama:'IMG_20260611_105603_00_092.jpg', hotSpots:[] },
  scene_021: { title:'Titik Panorama 21', panorama:'IMG_20260611_105950_00_093.jpg', hotSpots:[] },
  scene_022: { title:'Titik Panorama 22', panorama:'IMG_20260611_110119_00_094.jpg', hotSpots:[] },
  scene_023: { title:'Titik Panorama 23', panorama:'IMG_20260611_110149_00_095.jpg', hotSpots:[] },
  scene_024: { title:'Titik Panorama 24', panorama:'IMG_20260611_110243_00_096.jpg', hotSpots:[] },
  scene_025: { title:'Titik Panorama 25', panorama:'IMG_20260611_110437_00_097.jpg', hotSpots:[] },
  scene_026: { title:'Titik Panorama 26', panorama:'IMG_20260611_110636_00_098.jpg', hotSpots:[] },
  scene_027: { title:'Titik Panorama 27', panorama:'IMG_20260611_110736_00_099.jpg', hotSpots:[] },
  scene_028: { title:'Titik Panorama 28', panorama:'IMG_20260611_111745_00_100.jpg', hotSpots:[] },
  scene_029: { title:'Titik Panorama 29', panorama:'IMG_20260611_111929_00_101.jpg', hotSpots:[] },
  scene_030: { title:'Titik Panorama 30', panorama:'IMG_20260611_112026_00_102.jpg', hotSpots:[] },
  scene_031: { title:'Titik Panorama 31', panorama:'IMG_20260611_112221_00_104.jpg', hotSpots:[] },
  scene_032: { title:'Titik Panorama 32', panorama:'IMG_20260611_114604_00_105.jpg', hotSpots:[] },
  scene_033: { title:'Titik Panorama 33', panorama:'IMG_20260611_114744_00_106.jpg', hotSpots:[] },
  scene_034: { title:'Titik Panorama 34', panorama:'IMG_20260611_120733_00_107.jpg', hotSpots:[] },
  scene_035: { title:'Titik Panorama 35', panorama:'IMG_20260611_120853_00_108.jpg', hotSpots:[] },
  scene_036: { title:'Titik Panorama 36', panorama:'IMG_20260611_121304_00_109.jpg', hotSpots:[] },
  scene_037: { title:'Titik Panorama 37', panorama:'IMG_20260611_122007_00_110.jpg', hotSpots:[] },
  scene_038: { title:'Titik Panorama 38', panorama:'IMG_20260611_122146_00_111.jpg', hotSpots:[] },
  scene_039: { title:'Titik Panorama 39', panorama:'IMG_20260611_122240_00_112.jpg', hotSpots:[] },
  scene_040: { title:'Titik Panorama 40', panorama:'IMG_20260611_122340_00_113.jpg', hotSpots:[] },
  scene_041: { title:'Titik Panorama 41', panorama:'IMG_20260611_122857_00_114.jpg', hotSpots:[] },
  scene_042: { title:'Titik Panorama 42', panorama:'IMG_20260611_122941_00_115.jpg', hotSpots:[] },
  scene_043: { title:'Titik Panorama 43', panorama:'IMG_20260611_123239_00_116.jpg', hotSpots:[] },
};

// ─── Build Pannellum config ───────────────────────────────
const sceneIds  = Object.keys(SCENES);
const total     = sceneIds.length;
const pannConfig = { default: { firstScene:'scene_001', sceneFadeDuration:900, autoLoad:true, showControls:false, compass:false, keyboardZoom:true, mouseZoom:true }, scenes:{} };

sceneIds.forEach(id => {
  const s = SCENES[id];
  pannConfig.scenes[id] = {
    title:       s.title,
    type:        'equirectangular',
    panorama:    s.panorama,
    autoLoad:    true,
    showControls:false,
    hfov:        105,
    pitch:       0,
    yaw:         0,
    hotSpots:    s.hotSpots || [],
  };
});

// ─── State ───────────────────────────────────────────────
let viewer       = null;
let currentScene = 'scene_001';
let drawerOpen   = false;
const STORAGE_KEY = 'sitiwn_vt_scene';

// ─── Init ────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  buildDrawerList();

  // Restore last scene
  try { const saved = localStorage.getItem(STORAGE_KEY); if (saved && SCENES[saved]) currentScene = saved; } catch(e){}

  pannConfig.default.firstScene = currentScene;
  viewer = pannellum.viewer('pano', pannConfig);

  viewer.on('load', () => {
    document.getElementById('loader').classList.add('hidden');
    syncUI(currentScene);
  });
  viewer.on('scenechange', id => {
    currentScene = id;
    syncUI(id);
    try { localStorage.setItem(STORAGE_KEY, id); } catch(e){}
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  goRelative(-1);
    if (e.key === 'ArrowRight') goRelative(1);
    if (e.key === 'Escape' && drawerOpen) toggleDrawer();
  });

  document.addEventListener('fullscreenchange', () => {
    document.getElementById('fs-label').textContent = document.fullscreenElement ? 'Keluar' : 'Fullscreen';
  });
});

// ─── UI sync ─────────────────────────────────────────────
function syncUI(sceneId) {
  const idx   = sceneIds.indexOf(sceneId);
  const title = SCENES[sceneId]?.title || sceneId;

  document.getElementById('scene-title').textContent   = title;
  document.getElementById('scene-counter').textContent = `${idx + 1} / ${total}`;
  document.getElementById('progress-label').textContent = `${idx + 1} / ${total}`;
  document.getElementById('progress-fill').style.width  = `${((idx + 1) / total) * 100}%`;

  document.querySelectorAll('.scene-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.id === sceneId);
  });
}

// ─── Navigation ──────────────────────────────────────────
function loadScene(id) {
  if (!viewer || !id || !SCENES[id]) return;
  viewer.loadScene(id);
}
function goRelative(offset) {
  const idx  = sceneIds.indexOf(currentScene);
  const next = sceneIds[(idx + offset + total) % total];
  loadScene(next);
}

// ─── Drawer ───────────────────────────────────────────────
function buildDrawerList(filter = '') {
  const list = document.getElementById('scene-list');
  const q    = filter.toLowerCase();
  list.innerHTML = '';
  sceneIds.forEach((id, idx) => {
    const title = SCENES[id]?.title || id;
    if (q && !title.toLowerCase().includes(q) && !String(idx+1).includes(q)) return;
    const btn   = document.createElement('button');
    btn.className   = 'scene-btn' + (id === currentScene ? ' active' : '');
    btn.dataset.id  = id;
    btn.onclick     = () => { loadScene(id); if (window.innerWidth < 768) toggleDrawer(); };
    btn.innerHTML   = `<span class="scene-num">${idx+1}</span><span>${title}</span>`;
    list.appendChild(btn);
  });
}
function toggleDrawer() {
  drawerOpen = !drawerOpen;
  document.getElementById('scene-drawer').classList.toggle('open', drawerOpen);
  if (drawerOpen) { buildDrawerList(); document.getElementById('drawer-search').focus(); }
}
function filterScenes(val) { buildDrawerList(val); }

// ─── Fullscreen ───────────────────────────────────────────
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}
</script>
</body>
</html>
